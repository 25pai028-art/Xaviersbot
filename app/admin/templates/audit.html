{% extends "base.html" %}
{% block title %}Audit log{% endblock %}
{% block content %}
<h1>Audit log</h1>
<form class="filters" method="get" action="/admin/audit">
  <select name="action" aria-label="Action">
    <option value="">All actions</option>
    {% for a in actions %}<option value="{{ a }}" {% if a == action %}selected{% endif %}>{{ a }}</option>{% endfor %}
  </select>
  <button type="submit" class="secondary">Filter</button>
</form>
<div class="table-wrap"><table>
  <tr><th>When</th><th>Who</th><th>Action</th><th>What</th><th>Details</th></tr>
  {% for r in rows %}<tr><td>{{ r.at | dt }}</td><td>{{ r.user }}</td><td><span class="badge">{{ r.action }}</span></td>
    <td class="url">{{ r.target }}</td><td class="muted">{{ r.details }}</td></tr>
  {% else %}<tr><td colspan="5" class="muted">Nothing yet.</td></tr>{% endfor %}
</table></div>
{% endblock %}
