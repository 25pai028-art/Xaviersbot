<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SXCA Chat Test</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#667085; --accent:#1f3c88; --border:#d9dde5; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:820px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100vh; }
  h1 { font-size:1.1rem; margin:0 0 4px; }
  .note { color:var(--muted); font-size:.85rem; margin:0 0 12px; }
  #log { flex:1; overflow-y:auto; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; }
  .msg { margin:0 0 14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { text-align:right; }
  .user span { display:inline-block; background:var(--accent); color:#fff; padding:8px 12px; border-radius:12px 12px 2px 12px; text-align:left; }
  .bot span.body { display:inline-block; background:#eef1f6; padding:8px 12px; border-radius:12px 12px 12px 2px; }
  .sources { font-size:.8rem; color:var(--muted); margin-top:4px; white-space:normal; }
  .sources a { color:var(--accent); }
  .meta { font-size:.75rem; color:var(--muted); }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<main>
  <h1>Xavier's Assistant — Phase 1 test page</h1>
  <p class="note">Plain-text developer test page (English). The branded full-screen widget comes in Phase 4. Nothing you type is stored on the server.</p>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Ask about admissions, courses, fees…" maxlength="1000" aria-label="Your question">
    <button id="send">Send</button>
  </form>
</main>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const btn = document.getElementById('send');
const history = [];

function add(cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  const span = document.createElement('span');
  span.className = 'body';
  div.appendChild(span);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function parseSSE(buffer, onEvent) {
  const parts = buffer.split(/\r?\n\r?\n/);
  const rest = parts.pop();
  for (const part of parts) {
    let event = 'message', data = '';
    for (const line of part.split(/\r?\n/)) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    if (data) onEvent(event, JSON.parse(data));
  }
  return rest;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  btn.disabled = true;
  add('user').firstChild.textContent = question;
  const bot = add('bot');
  const body = bot.firstChild;
  body.textContent = '…';
  const started = performance.now();
  let answer = '', firstToken = null, sources = [], answered = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: question, history: history.slice(-6)})
    });
    if (!res.ok) { body.textContent = 'Error: ' + (await res.text()); return; }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf = parseSSE(buf + dec.decode(value, {stream: true}), (ev, data) => {
        if (ev === 'token') {
          if (firstToken === null) firstToken = performance.now();
          answer += data.text; body.textContent = answer; log.scrollTop = log.scrollHeight;
        } else if (ev === 'sources') { sources = data.sources; }
        else if (ev === 'status') { if (!answer) body.textContent = data.text; }
        else if (ev === 'replace') { answer = data.text; body.textContent = answer; }
        else if (ev === 'done') { answered = data.answered; }
        else if (ev === 'error') { body.textContent = data.message; }
      });
    }
    if (sources.length && answer && answered) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.append('Sources: ');
      sources.forEach((src, i) => {
        const a = document.createElement('a');
        a.href = src.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = src.title + (src.date ? ` (${src.date})` : '');
        s.append(a); if (i < sources.length - 1) s.append(' · ');
      });
      bot.appendChild(s);
    }
    const m = document.createElement('div');
    m.className = 'meta';
    const total = ((performance.now() - started) / 1000).toFixed(1);
    const ttft = firstToken ? ((firstToken - started) / 1000).toFixed(1) : '-';
    m.textContent = `first token ${ttft}s · total ${total}s`;
    bot.appendChild(m);
    history.push({role: 'user', content: question}, {role: 'assistant', content: answer});
  } catch (err) {
    body.textContent = 'Network error: ' + err;
  } finally {
    btn.disabled = false; input.focus();
  }
});
</script>
</body>
</html>
